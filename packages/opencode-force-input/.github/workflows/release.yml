name: Release

on:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Stable @latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check
      - name: Version or publish stable package
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          version-script: bunx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage stable package
        if: steps.changesets.outputs.has-changesets == 'false'
        run: npm stage publish --access public --tag latest --provenance

  beta:
    if: github.ref == 'refs/heads/v2'
    name: OpenCode v2 @beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check
      - name: Version or publish beta package
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          version-script: bunx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage beta package
        if: steps.changesets.outputs.has-changesets == 'false'
        run: npm stage publish --access public --tag beta --provenance
      - name: Create GitHub prerelease
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.changesets.outputs.publishedPackageVersions }}
        run: |
          version=$(node --print "require('./package.json').version")
          gh release create "v$version" --target "$GITHUB_SHA" \
            --title "@mynameistito/oc-ctrl-enter-force-import@$version" \
            --notes "OpenCode v2 beta release" --prerelease
