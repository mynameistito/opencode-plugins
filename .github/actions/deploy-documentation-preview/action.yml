name: Deploy documentation preview
description: Deploy the documentation preview with the pinned Alchemy action

inputs:
  cloudflare-account-id:
    description: Cloudflare account ID used by Alchemy
    required: true
  cloudflare-api-token:
    description: Cloudflare API token used by Alchemy
    required: true
  github-token:
    description: GitHub token used by Alchemy
    required: true
  pull-request-number:
    description: Resolved pull request number used by Alchemy
    required: true
  allow-fork-commits:
    description: Allow the protected deployment to use an approved fork commit
    default: "false"
    required: false

runs:
  using: composite
  steps:
    - name: Run Alchemy deployment
      uses: mynameistito/alchemy-deploy@aed01de4143eaf43e26bb9a1393f8a8f6564676c # fork cleanup support; use v2.3.2 after release
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
        ALLOW_FORK_COMMITS: ${{ inputs.allow-fork-commits }}
      with:
        worker-name: opencode-plugins-docs
        deploy-command: cd apps/web && bunx --no-install alchemy deploy --stage "$STAGE" --yes
        destroy-command: cd apps/web && bunx --no-install alchemy destroy --stage "$STAGE" --yes
        production-stage: prod
        production-url: https://opencode-plugins.mynameistito.com
        use-adopt: false
