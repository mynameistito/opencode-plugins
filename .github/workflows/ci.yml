# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    env:
      CODECOV_TOKEN_AVAILABLE: ${{ secrets.CODECOV_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        task:
          - typecheck
          - check
          - test
          - test:package
          - build
          - knip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.task == 'build' && github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Export Node executable path
        run: echo "NODE_EXECUTABLE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run task
        run: bun run ${{ matrix.task }}
      - name: Prepare documentation preview artifact
        if: matrix.task == 'build' && github.event_name == 'pull_request'
        run: |
          test -f apps/web/dist/index.html
          mkdir -p "$RUNNER_TEMP/alchemy-worker"
          cp .github/preview-worker.js "$RUNNER_TEMP/alchemy-worker/index.js"
          cp -R apps/web/dist "$RUNNER_TEMP/alchemy-worker/site"
      - name: Upload documentation preview artifact
        if: matrix.task == 'build' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alchemy-worker
          path: ${{ runner.temp }}/alchemy-worker/
          if-no-files-found: error
      - name: Upload force-input coverage to Codecov
        if: matrix.task == 'test' && env.CODECOV_TOKEN_AVAILABLE == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          files: packages/opencode-force-input/coverage/lcov.info
          flags: force-input
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload usage-limits coverage to Codecov
        if: matrix.task == 'test' && env.CODECOV_TOKEN_AVAILABLE == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          files: packages/opencode-usage-limits/coverage/lcov.info
          flags: usage-limits
          token: ${{ secrets.CODECOV_TOKEN }}
