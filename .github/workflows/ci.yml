name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN_AVAILABLE: ${{ secrets.CODECOV_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        task:
          - typecheck
          - check
          - test
          - test:package
          - build
          - knip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run task
        run: bun run ${{ matrix.task }}
      - name: Upload force-input coverage to Codecov
        if: matrix.task == 'test' && env.CODECOV_TOKEN_AVAILABLE == 'true'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          disable_search: true
          files: packages/opencode-force-input/coverage/lcov.info
          flags: force-input
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload usage-limits coverage to Codecov
        if: matrix.task == 'test' && env.CODECOV_TOKEN_AVAILABLE == 'true'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          disable_search: true
          files: packages/opencode-usage-limits/coverage/lcov.info
          flags: usage-limits
          token: ${{ secrets.CODECOV_TOKEN }}
