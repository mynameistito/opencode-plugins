# Temporary smoke test for PR metadata labeling.
name: Update @opencode/plugin

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-opencode-plugin
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Prepare update branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          branch_sha=$(git ls-remote --heads origin refs/heads/update-opencode-plugin | cut -f1)
          if [ -n "$branch_sha" ]; then
            git fetch origin update-opencode-plugin
          fi
          git checkout -B update-opencode-plugin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "branch_sha=$branch_sha" >> "$GITHUB_OUTPUT"

      - name: Check npm for the latest version
        id: latest
        run: bun scripts/update-opencode-plugin.ts

      - name: Install dependencies and update lockfile
        if: steps.latest.outputs.changed == 'true'
        run: bun install

      - name: Add plugin Changesets
        if: steps.latest.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          bun run changeset-add -- usage-limits patch "Update @opencode/plugin to $VERSION"
          bun run changeset-add -- force-input patch "Update @opencode/plugin to $VERSION"

      - name: Commit and push update
        if: steps.latest.outputs.changed == 'true'
        env:
          BRANCH_SHA: ${{ steps.branch.outputs.branch_sha }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          gh auth setup-git
          git add package.json bun.lock .changeset
          git commit -m "chore(deps): update @opencode/plugin to $VERSION"
          if [ -n "$BRANCH_SHA" ]; then
            git push --force-with-lease="refs/heads/update-opencode-plugin:$BRANCH_SHA" origin update-opencode-plugin
          else
            git push --set-upstream origin update-opencode-plugin
          fi

      - name: Open or update pull request
        if: steps.latest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          pr_number=$(gh pr list --head update-opencode-plugin --base main --json number --jq 'if length > 0 then .[0].number else empty end')
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "chore(deps): update @opencode/plugin" --body "Updates the shared @opencode/plugin dependency to $VERSION and includes patch Changesets for usage-limits and force-input."
          else
            gh pr create --base main --head update-opencode-plugin --title "chore(deps): update @opencode/plugin" --body "Updates the shared @opencode/plugin dependency to $VERSION and includes patch Changesets for usage-limits and force-input."
          fi
