name: Workflow security

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/dependabot.yml
      - .github/zizmor.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/dependabot.yml
      - .github/zizmor.yml

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: reviewdog/action-actionlint@086cc5300a077f608b81d2b03801bc382e417264 # v1.65.2
        with:
          fail_level: error
          reporter: github-annotations

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted security configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Checkout workflow changes for analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          config: trusted/.github/zizmor.yml
          inputs: source/.github
          version: 1.30.1
