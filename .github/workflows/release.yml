name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Upgrade npm
        run: npm install --global npm@latest
      - name: Verify npm staged publishing support
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from "node:child_process";

          const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major = 0, minor = 0, patch = 0] = version.split(".").map(Number);
          const supported = major > 11 || (major === 11 && (minor > 15 || (minor === 15 && patch >= 0)));

          if (!supported) {
            throw new Error(`npm ${version} does not support staged publishing. Use npm >= 11.15.0.`);
          }
          EOF
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify packages
        run: |
          bun run typecheck
          bun run check
          bun run build
      - name: Determine version PR title
        id: version-title
        run: |
          title=$(bun run version-pr-title)
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Stage packages on npm
        run: bun run release:stage
      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: bunx changeset version
          publish-script: bunx changeset tag
          pr-title: ${{ steps.version-title.outputs.title }}
          commit-message: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
