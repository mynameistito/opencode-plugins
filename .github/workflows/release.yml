on:
  push:
    branches:
      - main
  workflow_dispatch:
name: Release
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/chore/modernisation-20261106'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Upgrade npm
        run: npm install --global npm@11.15.0
      - name: Verify npm staged publishing support
        run: bun .github/scripts/verify-npm-staged-publishing.ts
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify packages
        run: |
          bun run typecheck
          bun run check
          bun run build
          bun run test
          bun run test:package
      - name: Determine version PR title
        id: version-title
        run: |
          title=$(bun .github/scripts/get-version-pr-title.ts)
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Stage packages on npm
        run: bun .github/scripts/stage-packages.ts
      - name: Load GitHub App credentials
        id: onepassword
        uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TARGET_SERVICE_ACCOUNT_TOKEN }}
          GH_APP_ID: op://i56qshgciuy4cdg4pjrilaeriy/7aa4yniajfri3k6tafs5z63sje/github_app_id
          GH_APP_PRIVATE_KEY: op://i56qshgciuy4cdg4pjrilaeriy/7aa4yniajfri3k6tafs5z63sje/github_app_private_key
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.onepassword.outputs.GH_APP_ID }}
          private-key: ${{ steps.onepassword.outputs.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bunx changeset version
          publish-script: bun .github/scripts/create-git-tag.ts
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: ${{ steps.version-title.outputs.title }}
          commit-message: "chore: release packages"
        env:
          GIT_EXECUTABLE: /usr/bin/git

  validate_target_vault:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'mynameistito/opencode-plugins' && github.ref == 'refs/heads/chore/modernisation-20261106'
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Load canonical references
        id: onepassword
        uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TARGET_SERVICE_ACCOUNT_TOKEN }}
          GH_APP_ID: op://i56qshgciuy4cdg4pjrilaeriy/7aa4yniajfri3k6tafs5z63sje/github_app_id
          GH_APP_PRIVATE_KEY: op://i56qshgciuy4cdg4pjrilaeriy/7aa4yniajfri3k6tafs5z63sje/github_app_private_key
      - name: Check canonical references are available
        env:
          GH_APP_ID: ${{ steps.onepassword.outputs.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ steps.onepassword.outputs.GH_APP_PRIVATE_KEY }}
        run: |
          test -n "$GH_APP_ID"
          test -n "$GH_APP_PRIVATE_KEY"
