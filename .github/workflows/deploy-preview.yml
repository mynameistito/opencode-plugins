# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: Deploy documentation preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  pull_request_target:
    types:
      - closed

concurrency:
  group: deploy-documentation-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.event.workflow_run.id) }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: write

jobs:
  resolve:
    name: Resolve preview pull request
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request') || (github.event_name == 'pull_request_target' && github.event.action == 'closed')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull_request_number: ${{ steps.resolve.outputs.pull_request_number }}
      trusted: ${{ steps.resolve.outputs.trusted }}
    steps:
      - name: Checkout trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Resolve pull request and author access
        id: resolve
        run: bun .github/scripts/resolve-preview-pull-request.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  announce:
    name: Announce preview approval
    needs: resolve
    if: >-
      github.event_name == 'workflow_run' && needs.resolve.outputs.pull_request_number != '' && needs.resolve.outputs.trusted != 'true'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Comment approval link
        run: bun .github/scripts/announce-preview-approval.ts
        env:
          PULL_REQUEST_NUMBER: ${{ needs.resolve.outputs.pull_request_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy preview (review required)
    needs: resolve
    if: needs.resolve.outputs.pull_request_number != '' && needs.resolve.outputs.trusted != 'true'
    runs-on: ubuntu-24.04
    # Required reviewers protect the Cloudflare credentials when the PR author
    # does not have write access and the deployment executes pull-request code.
    environment: docs-preview
    steps:
      - name: Run Alchemy deployment
        uses: mynameistito/alchemy-deploy@c508ae6038e5936b9f19e3eb6284c3aa42312b43 # approved fork preview support
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          worker-name: opencode-plugins-docs
          deploy-command: cd apps/web && bunx --no-install alchemy deploy --stage "$STAGE" --yes
          destroy-command: cd apps/web && bunx --no-install alchemy destroy --stage "$STAGE" --yes
          production-stage: prod
          production-url: https://opencode-plugins.mynameistito.com
          use-adopt: false
          pull-request-number: ${{ needs.resolve.outputs.pull_request_number }}
          allow-fork-commits: true

  deploy-trusted:
    name: Deploy preview (trusted author)
    needs: resolve
    if: needs.resolve.outputs.pull_request_number != '' && needs.resolve.outputs.trusted == 'true'
    runs-on: ubuntu-24.04
    # A write-level PR author is trusted to run pull-request code with the
    # repository's Cloudflare credentials, so no reviewer gate is needed.
    steps:
      - name: Checkout trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Recheck author access
        id: verify-access
        run: bun .github/scripts/verify-preview-author-access.ts
        env:
          PULL_REQUEST_NUMBER: ${{ needs.resolve.outputs.pull_request_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Alchemy deployment
        if: success() && steps.verify-access.outputs.trusted == 'true'
        uses: mynameistito/alchemy-deploy@c508ae6038e5936b9f19e3eb6284c3aa42312b43 # approved fork preview support
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          worker-name: opencode-plugins-docs
          deploy-command: cd apps/web && bunx --no-install alchemy deploy --stage "$STAGE" --yes
          destroy-command: cd apps/web && bunx --no-install alchemy destroy --stage "$STAGE" --yes
          production-stage: prod
          production-url: https://opencode-plugins.mynameistito.com
          use-adopt: false
          pull-request-number: ${{ needs.resolve.outputs.pull_request_number }}
