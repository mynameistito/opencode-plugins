name: Deploy documentation preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  pull_request:
    types:
      - closed

concurrency:
  group: deploy-documentation-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.event.workflow_run.id) }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'pull_request' && github.event.action == 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Run Alchemy deployment
        uses: mynameistito/alchemy-deploy@eb0bfa48c6f692119db4eefde9e8b093541767c7 # v2.3.1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          worker-name: opencode-plugins-docs
          deploy-command: bunx --no-install alchemy deploy --stage "$STAGE" --yes
          destroy-command: bunx --no-install alchemy destroy --stage "$STAGE" --yes
          production-stage: prod
          production-url: https://opencode-plugins.mynameistito.com
          use-adopt: false
