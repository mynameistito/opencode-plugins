# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: Documentation links

on:
  pull_request:
    paths:
      - README.md
      - apps/web/**
      - packages/*/README.md
      - .lycheeignore
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --verbose --no-progress --max-retries 3 --retry-wait-time 2 --timeout 20 --include-mail=false --accept 200,206,301,302,307,308,429 --exclude-path 'apps/web/docs/index\.mdx$' README.md 'apps/web/**/*.md' 'apps/web/**/*.mdx' 'packages/*/README.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check homepage links against production
        if: github.event_name != 'pull_request'
        run: lychee --verbose --no-progress --max-retries 3 --retry-wait-time 2 --timeout 20 --include-mail=false --accept 200,206,301,302,307,308,429 --base-url https://opencode-plugins.mynameistito.com apps/web/docs/index.mdx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
